# Angie config for Serial Projector: static files from /srv/serial-projector/site
# on port 8080.
#
# The container knows nothing about TLS or hostnames. It answers on any host
# over http, and an outer proxy terminates TLS. Port 8080 instead of 80: the
# image then runs unprivileged, which rootless podman needs no extra setup for.
server {
    listen      8080 default_server;
    server_name _;

    root        /srv/serial-projector/site;
    index       index.html;
    charset     utf-8;

    gzip            on;
    gzip_min_length 512;
    gzip_types      text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_vary       on;

    # index.html, sw.js and manifest.webmanifest keep their names across
    # releases, so they must be revalidated: a cached index.html points at
    # hashed bundles that no longer exist, and a cached sw.js holds back
    # updates. Locations that cache longer set their own header, which replaces
    # this one instead of adding to it.
    add_header Cache-Control "no-cache" always;

    # Vite puts a content hash in every /assets/ name, so those never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Icons and screenshots are named by hand, they change under a stable name
    # but rarely.
    location ~ ^/(icons|screenshots)/ {
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    location = /manifest.webmanifest {
        # angie's mime.types has no mapping for .webmanifest; the PWA manifest
        # has to be served as application/manifest+json.
        default_type application/manifest+json;
    }

    # The application is a single page with no client-side routes, so anything
    # that is not a file on disk is a 404.
    location / {
        try_files $uri $uri/ =404;
    }
}
