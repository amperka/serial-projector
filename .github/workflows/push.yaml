name: Deploy
permissions:
  contents: read
  id-token: write # OIDC token for workload identity federation

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-26.04
    env:
      GCS_BUCKET: gs://amperka-projector

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: npm run test

      # Trades the GitHub OIDC token for a short-lived Google Cloud credential
      # and exports it for gcloud. The service account (gh-serial-projector) is
      # bound to this repository id only and holds storage.objectAdmin on the
      # bucket; see amperka-infra terraform/prod/gcp/wif.tf.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.GCP_WIF_PROVIDER }}"
          service_account: "${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}"

      - name: Publish to Google Cloud Storage
        run: |
          # `gcloud storage`, not gsutil: gsutil ignores the credentials the
          # auth step exports.
          # `rsync` mirrors dist/ into the bucket root and deletes the objects
          # the build no longer produces, which is what the previous
          # `rclone sync` did.
          gcloud storage rsync dist "${GCS_BUCKET}" \
            --recursive --delete-unmatched-destination-objects
          # Content type is guessed from the file extension through the
          # runner's MIME database, which is not guaranteed to know
          # .webmanifest; the PWA manifest needs its type.
          gcloud storage objects update "${GCS_BUCKET}/manifest.webmanifest" \
            --content-type=application/manifest+json
